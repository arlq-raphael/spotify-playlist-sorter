[project]
name = "spotify-playlist-sorter"
version = "0.1.0"
description = "Sort your Spotify Liked Songs into per-genre and per-decade playlists, automatically."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Raphaël Caruso" }]
keywords = ["spotify", "playlist", "music", "genre", "cli"]
dependencies = [
    "spotipy>=2.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/arlq/spotify-playlist-sorter"

[project.scripts]
spotify-sorter = "spotify_sorter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spotify_sorter = ["../config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=spotify_sorter --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["spotify_sorter"]
branch = true

[tool.coverage.report]
show_missing = true
# Regression floor — the pure classification/dedupe logic is well covered; the
# network layer (auth/cli/sorter/library I-O) is not unit-tested. Ratchet this
# up as coverage grows; it must never drop below the current level.
fail_under = 30

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]  # import-sort, pyupgrade, bugbear
