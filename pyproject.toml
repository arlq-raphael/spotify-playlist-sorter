[project]
name = "spotify-playlist-sorter"
version = "0.1.0"
description = "Sort your Spotify Liked Songs into per-genre and per-decade playlists, automatically."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Raphaël Caruso" }]
keywords = ["spotify", "playlist", "music", "genre", "cli"]
dependencies = [
    "spotipy>=2.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/arlq/spotify-playlist-sorter"

[project.scripts]
spotify-sorter = "spotify_sorter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spotify_sorter = ["../config/*.yaml"]
