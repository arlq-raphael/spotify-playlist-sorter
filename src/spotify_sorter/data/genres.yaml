# ---------------------------------------------------------------------------
# spotify-playlist-sorter configuration
#
# Genre classification is deterministic: for each track we collect the Spotify
# genres of its artists, then walk `genre_buckets` TOP-TO-BOTTOM and pick the
# FIRST bucket whose any `match` substring appears in any of those genres.
# => Order matters: put more specific buckets ABOVE more generic ones.
#
# Edit freely — this is just a sensible default. `match` values are matched
# case-insensitively as substrings against Spotify genre strings.
# ---------------------------------------------------------------------------

options:
  # Where a track's artists have genres but none match a bucket:
  unmatched_genre_bucket: "Other"   # set to null to leave such tracks unsorted
  # Where Spotify returns NO genres for any artist (common for small artists):
  no_genre_bucket: "Unknown Genre"  # set to null to leave them unsorted
  # Prefix applied to every created playlist name (e.g. "🎧 ") — "" for none.
  playlist_prefix: ""
  public_playlists: true

# --- Genre sources (ordered: first provider with a non-empty result wins) ---
# Available: musicbrainz (exact ISRC lookup), discogs (artist+title -> genre/style),
# spotify (artist genres, always available — no token needed).
# Order matters for accuracy, not just speed: the first two identify the RECORDING, so they
# can tell a jazz track by a rock artist apart. Spotify only knows genres per ARTIST, so every
# track by an artist gets the same label whatever that track sounds like. It is last for that
# reason — it is the floor, not the preference.
genre_providers: [musicbrainz, discogs, spotify]

discogs:
  # The Discogs personal access token is read from the DISCOGS_TOKEN env var, not stored here.
  # Without it, the discogs provider is skipped and resolution falls through to the next source.
  user_agent: "spotify-playlist-sorter/0.1 +https://github.com/arlq-raphael/spotify-playlist-sorter"

musicbrainz:
  # MusicBrainz needs no token, only a unique User-Agent.
  user_agent: "spotify-playlist-sorter/0.1 +https://github.com/arlq-raphael/spotify-playlist-sorter"

cache:
  # Persistent cache of external genre lookups (git-ignored) so re-runs don't re-query.
  path: ".genre-cache.json"

# --- Decade classification (by album release year) -------------------------
decades:
  enabled: true
  format: "{decade}s"      # e.g. 1970 -> "1970s"
  # Years before this are grouped into the earliest decade (or set floor: null
  # to leave pre-floor tracks unsorted by decade).
  floor: 1950

# --- Genre buckets (ordered: specific first) -------------------------------
genre_buckets:
  - name: "Ragga / Dancehall"
    match: [dancehall, ragga]
  - name: "Reggae Roots & Dub"
    match: [reggae, dub, ska, rocksteady, roots]
  - name: "French Rap"
    match: [french hip hop, rap francais, rap conscient, pop urbaine]
  - name: "Hip-Hop / Rap"
    match: [hip hop, rap, trap, drill, grime]
  - name: "Trip-Hop / Downtempo"
    match: [trip hop, downtempo, chillhop, nu jazz, abstract]
  - name: "House / Electro"
    match: [house, "french touch", nu disco, disco house, electro]
  - name: "Techno / EDM"
    match: [techno, edm, trance, dubstep, "drum and bass", rave, hardstyle]
  - name: "Jazz"
    match: [jazz, bebop, swing, bossa nova]
  - name: "Funk / Soul"
    match: [funk, soul, motown, disco, boogie, r&b, rhythm and blues]
  - name: "Reggaeton / Latin"
    match: [reggaeton, latin, salsa, cumbia, samba, afrobeat, afro]
  - name: "Blues"
    match: [blues, delta blues]
  - name: "Metal"
    match: [metal, metalcore, hardcore]
  - name: "Punk / New Wave"
    match: [punk, new wave, post-punk, synthpop, darkwave, coldwave]
  - name: "Rock"
    match: [rock, grunge, indie, britpop, psychedelic]
  - name: "Pop"
    match: [pop, chanson, variété, variete]
  - name: "Electronic"
    match: [electronic, ambient, idm, synthwave]
  - name: "World"
    match: [world, folk, traditional]
