name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test + coverage (fails under the floor in pyproject.toml)
        run: pytest

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage (py${{ matrix.python-version }})"
            echo '```'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage.xml
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  specs:
    # Guards the spec set itself. `openspec validate` alone is NOT enough: it only checks
    # the files present in the checkout, so a spec that was never committed simply isn't
    # there and it passes. That is exactly how openspec/specs/credentials/ went missing —
    # a bare `credentials` line in .gitignore swallowed it, and it survived three merged
    # PRs because every dev machine had the file on disk. Hence the two checks after it.
    name: specs (openspec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install openspec
        # Pinned to the major so a 2.x release cannot silently change validation rules.
        run: npm install -g @fission-ai/openspec@1

      - name: Validate specs
        run: openspec validate --specs --strict

      - name: Every declared capability has a committed spec
        run: |
          python3 - <<'PY'
          import re, subprocess, sys, pathlib

          tracked = set(subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.split())

          # Capabilities are declared in each change's proposal as: - `name` — description
          decl = re.compile(r"^- `([a-z0-9-]+)`")
          missing = []
          for proposal in sorted(pathlib.Path("openspec/changes").rglob("proposal.md")):
              in_section = False
              for line in proposal.read_text(encoding="utf-8").splitlines():
                  if line.startswith("###"):
                      in_section = "Capabilities" in line
                      continue
                  if line.startswith("## "):
                      in_section = False
                  if not in_section:
                      continue
                  m = decl.match(line)
                  if m and f"openspec/specs/{m.group(1)}/spec.md" not in tracked:
                      missing.append((m.group(1), str(proposal)))

          for cap, src in sorted(set(missing)):
              print(f"::error::capability '{cap}' is declared in {src} but "
                    f"openspec/specs/{cap}/spec.md is not committed")
          sys.exit(1 if missing else 0)
          PY

      - name: No spec file is excluded by .gitignore
        run: |
          # Catches an ignore rule that starts matching something already committed.
          if git ls-files -z openspec | git check-ignore --stdin -z --verbose; then
            echo "::error::the paths above are under openspec/ but excluded by .gitignore"
            exit 1
          fi
          echo "no openspec path is gitignored"

  install-smoke:
    # The test job installs editable (`-e`), which resolves the bundled config from the
    # source tree — so it cannot catch a config that fails to ship in the wheel. This job
    # installs the built wheel and runs the CLI from OUTSIDE the checkout, where neither
    # the source tree nor a ./config directory can mask a packaging regression.
    name: install smoke (wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Wheel contains the bundled config
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          target = "spotify_sorter/data/genres.yaml"
          print(whl, "->", target, "present:", target in names)
          sys.exit(0 if target in names else 1)
          PY

      - name: Install the wheel (non-editable) and run from outside the checkout
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          mkdir -p /tmp/neutral && cd /tmp/neutral   # no repo, no ./config here
          export XDG_CONFIG_HOME=/tmp/neutral/xdg

          # 1. the packaged default loads with no user config anywhere
          /tmp/venv/bin/python -c "
          from spotify_sorter.config import Config
          c = Config.load()
          assert c.genre_buckets, 'no genre buckets loaded from the packaged default'
          print('default config OK:', len(c.genre_buckets), 'buckets')"

          # 2. `sort` gets past config loading (fails on credentials, not FileNotFoundError)
          out=$(/tmp/venv/bin/spotify-sorter sort --dry-run 2>&1 || true)
          echo "$out"
          case "$out" in
            *"Missing environment variables"*) echo "sort reached the credentials check OK" ;;
            *) echo "::error::sort failed before the credentials check"; exit 1 ;;
          esac

          # 3. `configure` writes a user config + a 0600 credentials file, and it round-trips
          # NB: a throwaway literal, not a secret. Never put a real token in a CI command
          # line (or your shell) — it lands in logs, shell history, and `ps` output.
          /tmp/venv/bin/spotify-sorter configure --non-interactive --prefix "My " --private \
            --discogs-token not-a-real-token
          perms=$(stat -c '%a' "$XDG_CONFIG_HOME/spotify-sorter/credentials")
          [ "$perms" = "600" ] || { echo "::error::credentials perms are $perms, expected 600"; exit 1; }
          /tmp/venv/bin/python -c "
          from spotify_sorter.config import Config
          c = Config.load()
          assert c.playlist_prefix == 'My ', c.playlist_prefix
          assert c.public_playlists is False
          assert c.genre_buckets, 'user config clobbered the inherited defaults'
          print('configure round-trip OK')"
